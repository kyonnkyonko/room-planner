<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>新家規劃</title>
<style>
/* Password gate. The planner itself is AES-GCM encrypted in data.json; this page only decrypts it in the browser. */
:root{--bg:#eceeea;--panel:#fff;--ink:#1c2220;--muted:#5b6560;--line:#d3d9d4;--tape:#efb60e;--warn:#c4362c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#131715;--panel:#1c2120;--ink:#e6ebe8;--muted:#9aa49f;--line:#313a36;--tape:#f2c230;--warn:#ff7264;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
form{width:min(100%,360px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px;display:grid;gap:12px}
h1{margin:0;font-size:1.3rem;letter-spacing:.03em}
p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
label.rm{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-weight:500;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--panel);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--warn);font-size:.9rem;min-height:1.4em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>新家規劃</h1>
  <p>這個網頁有密碼保護，請輸入密碼。</p>
  <input type="text" name="username" value="room-planner" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" aria-label="密碼" placeholder="密碼" required>
  <label class="rm"><input type="checkbox" id="rm"> 在這台裝置記住密碼</label>
  <button type="submit" id="go">打開</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  var KEY = 'room-planner-pw';
  var $ = function (s) { return document.querySelector(s); };
  var b64 = function (s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  var data = fetch('data.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('load'); return r.json(); });
  data.catch(function () {});
  async function unlock(pw, remember) {
    if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
    var d = await data;
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(d.salt), iterations: d.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, key, b64(d.ct)); }
    catch (e) { throw new Error('badpw'); }
    try { if (remember) localStorage.setItem(KEY, pw); } catch (e) {}
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }
  function fail(e) {
    var m = e && e.message;
    $('#err').textContent = m === 'badpw' ? '密碼不對，請再試一次。' : m === 'nocrypto' ? '這個瀏覽器不能解鎖，請用 Chrome、Safari 或 Edge 打開 https 網址。' : '資料載入失敗，請檢查網路後重新整理。';
    $('#go').disabled = false; $('#go').textContent = '打開';
  }
  $('#f').addEventListener('submit', function (e) {
    e.preventDefault(); $('#err').textContent = ''; $('#go').disabled = true; $('#go').textContent = '解鎖中…';
    unlock($('#pw').value.trim(), $('#rm').checked).catch(fail);
  });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    $('#rm').checked = true; $('#go').disabled = true; $('#go').textContent = '解鎖中…';
    unlock(saved, true).catch(function (e) { try { if (e.message === 'badpw') localStorage.removeItem(KEY); } catch (x) {} fail(e); });
  }
})();
</script>
</body>
</html>
